dding:.5rem;color:#516478}.tag-list{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}.tag-list button{border:1px solid var(--line);border-radius:99px;padding:.35rem .7rem;background:var(--surface);color:var(--muted);cursor:pointer}.section{padding:3.5rem 0;border-bottom:1px solid var(--line)}.section h2{margin:0 0 1.2rem}.feed-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.feed-card{display:block;padding:1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none}.feed-card:hover{border-color:var(--accent)}.feed-card strong{display:block}.feed-card p{margin:.4rem 0;color:var(--muted);font-size:.88rem}.feed-card small{color:var(--accent)}.ad-wrap{padding:3rem 0}.ad-slot{min-height:90px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}footer{padding:2rem 0;color:var(--muted);font-size:.85rem}footer nav{display:flex;gap:1rem;flex-wrap:wrap}footer a{color:var(--muted)}@media (max-width: 720px){.desktop-nav{display:none}.mobile-topic-nav{display:flex}.hero{padding:3.5rem 0}.feed-grid{grid-template-columns:1fr}.search-form button{padding-inline:.8rem}}

  <main id="main-content">
    <section class="hero"><p class="eyebrow">Useful guides &amp; tools</p><h1>필요한 답을<br>더 빠르게 찾으세요</h1><p class="hero-copy">캠핑·차박, 게임, 여행, 자동차·생활 정보와 설치 없이 쓰는 무료 도구를 한곳에서 찾아보세요.</p><form id="search-form" class="search-form" role="search"><input id="site-search" type="search" aria-label="사이트 콘텐츠 검색" aria-controls="search-results" placeholder="예: 캠핑, 팰월드, QR 코드"><button type="submit">검색</button></form><div id="search-results" class="search-results" role="region" aria-label="검색 결과" aria-live="polite"></div><div id="popular-tags" class="tag-list" aria-label="인기 태그"></div></section>

  <script>
    let searchIndex=null;const categoryTargets={"캠핑·차박":"feed-camping","게임":"feed-game","무료 도구":"feed-tools","여행":"feed-travel","자동차·생활":"feed-car"};const esc=value=>String(value||"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
    function card(item){const date=item.updated_at?`<small>${esc(item.updated_at)}</small>`:"";const tags=(item.tags||[]).slice(0,3).map(tag=>`#${esc(tag)}`).join(" ");return `<a class="feed-card" href="${esc(item.url)}"><strong>${esc(item.title)}</strong>${item.description?`<p>${esc(item.description.slice(0,110))}</p>`:""}<small>${esc(item.category)}${date?` · ${date}`:""}${tags?` · ${tags}`:""}</small></a>`}function renderItems(target,items){document.getElementById(target).innerHTML=(items||[]).map(card).join("")||"<p class='search-status'>표시할 콘텐츠가 없습니다.</p>"}
    function renderHomeFeed(feed){renderItems("latest-feed",feed.latest);Object.entries(feed.categories||{}).forEach(([category,items])=>{if(categoryTargets[category])renderItems(categoryTargets[category],items)});const secondary=["금융·투자","AI·테크","생활정보"].flatMap(category=>(feed.categories||{})[category]||[]);renderItems("feed-secondary",secondary);const tags=document.getElementById("popular-tags");tags.innerHTML=(feed.popular_tags||[]).slice(0,12).map(tag=>`<button type="button" data-tag="${esc(tag)}">#${esc(tag)}</button>`).join("");tags.querySelectorAll("button").forEach(button=>button.addEventListener("click",()=>runSearch(button.dataset.tag)))}
    async function loadHomeFeed(){try{const response=await fetch("/data/home-feed-ko.json");if(!response.ok)throw new Error("feed");renderHomeFeed(await response.json())}catch(error){document.querySelectorAll(".feed-grid").forEach(node=>node.innerHTML="<p class='search-status'>콘텐츠를 불러오지 못했습니다.</p>")}}
    async function ensureSearchIndex(){if(searchIndex)return searchIndex;const results=document.getElementById("search-results");results.innerHTML="<p class='search-status'>검색 데이터를 불러오는 중...</p>";results.classList.add("is-open");const response=await fetch("/data/content-index-ko.json");if(!response.ok)throw new Error("index");searchIndex=await response.json();return searchIndex}
    function score(item,query){const q=query.toLowerCase(),title=(item.title||"").toLowerCase(),aliases=(item.aliases||[]).join(" ").toLowerCase(),tags=(item.tags||[]).join(" ").toLowerCase(),category=(item.category||"").toLowerCase(),description=(item.description||"").toLowerCase();if(title===q)return 500;if(title.includes(q))return 400;if(aliases.includes(q))return 300;if(tags.includes(q))return 200;if(category.includes(q))return 100;if(description.includes(q))return 50;return 0}
    async function runSearch(value){const input=document.getElementById("site-search");input.value=value;const results=document.getElementById("search-results");try{const items=await ensureSearchIndex();const query=value.trim().replace(/\s+/g," ").toLowerCase();const ranked=items.map(item=>({item,score:score(item,query)})).filter(row=>row.score>0).sort((a,b)=>b.score-a.score||a.item.title.localeCompare(b.item.title)||a.item.url.localeCompare(b.item.url)).slice(0,20);results.innerHTML=ranked.length?ranked.map(row=>card(row.item)).join(""):"<p class='search-empty'>검색 결과가 없습니다.</p>";results.classList.add("is-open")}catch(error){results.innerHTML="<p class='search-empty'>검색 데이터를 불러오지 못했습니다.</p>";results.classList.add("is-open")}}
    document.getElementById("search-form").addEventListener("submit",event=>{event.preventDefault();runSearch(document.getElementById("site-search").value)});document.getElementById("site-search").addEventListener("input",event=>{if(event.target.value.trim())runSearch(event.target.value);else document.getElementById("search-results").classList.remove("is-open")});loadHomeFeed();
  </script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8830524482034754" crossorigin="anonymous"></script>
