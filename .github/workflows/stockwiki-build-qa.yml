name: StockWiki Build QA

on:
  pull_request:
    paths:
      - '.github/workflows/stockwiki-build-qa.yml'
      - 'kor/stockwiki/**'
      - 'tests/test_canonical_inventory.py'
      - 'tests/test_stockwiki_ad_safety.py'
      - 'tests/test_stockwiki_build_integrity.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kor/stockwiki/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify repository canonical inventory
        run: python -m pytest -q tests/test_canonical_inventory.py

      - name: Install locked StockWiki dependencies
        run: npm ci
        working-directory: kor/stockwiki

      - name: Build StockWiki
        run: npm run build
        working-directory: kor/stockwiki

      - name: Verify StockWiki canonicals and build integrity
        run: python -m pytest -q tests/test_stockwiki_build_integrity.py tests/test_stockwiki_ad_safety.py
