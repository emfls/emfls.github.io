name: 일일 콘텐츠 자동 생성

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 00:00 KST (UTC 15:00)
  workflow_dispatch:       # 수동 실행 가능

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install yfinance jinja2 requests

      - name: 콘텐츠 생성
        run: python scripts/run_all.py
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "자동 생성: $(date +'%Y-%m-%d')"
          git push
