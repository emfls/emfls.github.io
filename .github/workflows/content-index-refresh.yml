name: Refresh Korean content index
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kor/**/*.html'
      - 'scripts/build_content_index.py'
      - 'tests/test_content_index.py'
      - 'tests/test_homepage_redesign.py'
      - 'data/content-overrides-ko.json'
      - '.github/workflows/content-index-refresh.yml'
concurrency:
  group: content-index-refresh
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Rebuild and test
        run: |
          python3 -m pip install pytest
          python3 scripts/build_content_index.py
          python3 -m pytest tests/test_content_index.py tests/test_homepage_redesign.py -q
      - name: Commit generated indexes
        run: |
          if git diff --quiet -- data/content-index-ko.json data/home-feed-ko.json; then echo 'Generated indexes unchanged.'; exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/content-index-ko.json data/home-feed-ko.json
          git commit -m "chore: refresh Korean content index"
          git push
          test -n "${{ secrets.PAGES_DEPLOY_TOKEN }}" || { echo 'PAGES_DEPLOY_TOKEN (Pages write PAT/App token) is required'; exit 1; }
          gh api --method POST repos/${{ github.repository }}/pages/builds \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H "Authorization: Bearer ${{ secrets.PAGES_DEPLOY_TOKEN }}"
