name: Refresh Korean content index
on:
  workflow_dispatch:
  push:
    paths:
      - 'kor/**/*.html'
      - 'scripts/build_content_index.py'
      - 'tests/test_content_index.py'
concurrency:
  group: content-index-refresh
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Rebuild and test
        run: |
          python3 scripts/build_content_index.py
          python3 -m pytest tests/test_content_index.py tests/test_homepage_redesign.py -q
      - name: Commit generated indexes
        run: |
          if git diff --quiet -- data/content-index-ko.json data/home-feed-ko.json; then echo 'Generated indexes unchanged.'; exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/content-index-ko.json data/home-feed-ko.json
          git commit -m "chore: refresh Korean content index"
          git push
