name: AdSense Collection

on:
  schedule:
    - cron: "47 1 * * *" # daily UTC 01:47, before GA4 and GSC consumers
  workflow_dispatch:
    inputs:
      operation:
        description: "Run the scheduled collection or an audit-only PAGE_URL probe"
        required: true
        type: choice
        default: collect
        options:
          - collect
          - page_url_probe

concurrency:
  group: site-measurement-collection
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    if: github.event_name == 'schedule' || inputs.operation != 'page_url_probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul
      ADSENSE_ACCOUNT_NAME: ${{ vars.ADSENSE_ACCOUNT_NAME }}
      ADSENSE_OAUTH_CLIENT_ID: ${{ secrets.ADSENSE_OAUTH_CLIENT_ID }}
      ADSENSE_OAUTH_CLIENT_SECRET: ${{ secrets.ADSENSE_OAUTH_CLIENT_SECRET }}
      ADSENSE_OAUTH_REFRESH_TOKEN: ${{ secrets.ADSENSE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The refresh token must be issued for https://www.googleapis.com/auth/adsense.readonly.
      - name: Collect direct AdSense latest snapshot
        run: python3 scripts/collect_adsense_snapshot.py --output data/performance/adsense-latest.json --breakdown-output "$RUNNER_TEMP/adsense-breakdown-latest.json" --days 7

      - name: Validate direct AdSense snapshot
        run: python3 scripts/collect_adsense_snapshot.py --validate-only data/performance/adsense-latest.json

      - name: Validate direct AdSense breakdown snapshot
        run: python3 scripts/collect_adsense_snapshot.py --validate-breakdown-only "$RUNNER_TEMP/adsense-breakdown-latest.json"

      - name: Build compact AdSense diagnostics
        run: python3 scripts/collect_adsense_snapshot.py --build-diagnostics-from "$RUNNER_TEMP/adsense-breakdown-latest.json" --diagnostics-output data/performance/adsense-diagnostics-latest.json

      - name: Validate compact AdSense diagnostics
        run: python3 scripts/collect_adsense_snapshot.py --validate-diagnostics-only data/performance/adsense-diagnostics-latest.json

      # Preserve the full raw rows for diagnosis even if compact validation or the tracked size guard fails.
      - name: Upload raw AdSense breakdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adsense-breakdown-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adsense-breakdown-latest.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit refreshed AdSense snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/performance/adsense-latest.json data/performance/adsense-diagnostics-latest.json
          git diff --cached --check
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh direct AdSense latest snapshot"
            git push
          fi

  probe:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'page_url_probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TZ: Asia/Seoul
      ADSENSE_ACCOUNT_NAME: ${{ vars.ADSENSE_ACCOUNT_NAME }}
      ADSENSE_OAUTH_CLIENT_ID: ${{ secrets.ADSENSE_OAUTH_CLIENT_ID }}
      ADSENSE_OAUTH_CLIENT_SECRET: ${{ secrets.ADSENSE_OAUTH_CLIENT_SECRET }}
      ADSENSE_OAUTH_REFRESH_TOKEN: ${{ secrets.ADSENSE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run audit-only PAGE_URL probe matrix
        run: >-
          python3 scripts/collect_adsense_snapshot.py
          --page-url-probe-output
          "$RUNNER_TEMP/adsense-page-url-probe/probe-summary.json"

      - name: Upload bounded PAGE_URL probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adsense-page-url-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/adsense-page-url-probe/
          if-no-files-found: warn
          retention-days: 7
