name: GA4 Collection

on:
  schedule:
    - cron: "17 2 * * *" # daily UTC 02:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-measurement-collection
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    if: github.ref_name != 'codex/locale-measurement-audit-90d'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      GA4_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GA4 Data API client
        run: python3 -m pip install google-analytics-data google-auth

      - name: Collect GA4 latest snapshot
        run: python3 scripts/collect_ga4_snapshot.py --output data/performance/ga4-latest.json --days 28

      - name: Validate GA4 source snapshot
        run: |
          python3 - <<'PY'
          import json
          from datetime import date
          p = json.load(open('data/performance/ga4-latest.json'))
          assert p['site']['ga4']['status'] == 'VERIFIED'
          assert p['site']['ga4']['source'] == 'GOOGLE_ANALYTICS_DATA_API'
          assert p['collection']['source'] == 'GOOGLE_ANALYTICS_DATA_API'
          assert p['pages']
          assert p['site']['ga4']['period'] == p['periods']['ga4']
          end = date.fromisoformat(p['periods']['ga4']['end'])
          as_of = date.fromisoformat(p['as_of'])
          assert (as_of - end).days <= 7
          PY

      - name: Commit refreshed GA4 measurement artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/performance/ga4-latest.json
          git diff --staged --quiet || git commit -m "chore: refresh GA4 source snapshot"
          git push

  audit_locale_measurement:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/locale-measurement-audit-90d'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      GA4_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON_B64 }}
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GA4 and Search Console read-only clients
        run: python3 -m pip install google-analytics-data google-api-python-client google-auth

      - name: Pin latest main baseline and prepare artifact directory
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          BASE_MAIN_SHA="$(git rev-parse origin/main)"
          AUDIT_COMMON_BASE_SHA=d87451872ecffe95d0b0e1da8d4a698a76f52e6c
          git merge-base --is-ancestor "$AUDIT_COMMON_BASE_SHA" origin/main
          git merge-base --is-ancestor "$AUDIT_COMMON_BASE_SHA" HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "BASE_MAIN_SHA=$BASE_MAIN_SHA" >> "$GITHUB_ENV"
          echo "Audit head: $GITHUB_SHA"
          echo "Latest main baseline: $BASE_MAIN_SHA"
          mkdir -p "$RUNNER_TEMP/locale-90d"

      - name: Collect and classify all locale pages
        run: >-
          python3 scripts/audit_locale_90d_measurement.py
          --base-sha "$BASE_MAIN_SHA"
          --repo-root "$GITHUB_WORKSPACE"
          --output-dir "$RUNNER_TEMP/locale-90d"

      - name: Verify artifact-only output and unchanged checkout
        run: |
          python3 - "$RUNNER_TEMP/locale-90d" <<'PY'
          import sys
          from pathlib import Path
          expected = {
              "locale-90d-summary.json",
              "locale-90d-pages.csv",
              "locale-90d-ga4-raw.json",
              "locale-90d-gsc-raw.json",
          }
          actual = {path.name for path in Path(sys.argv[1]).iterdir() if path.is_file()}
          assert actual == expected, (actual, expected)
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload locale measurement artifact
        uses: actions/upload-artifact@v4
        with:
          name: locale-90d-measurement-${{ github.run_id }}
          path: ${{ runner.temp }}/locale-90d/
          if-no-files-found: error
          retention-days: 7
