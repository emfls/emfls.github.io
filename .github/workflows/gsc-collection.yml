name: GSC Collection

on:
  schedule:
    - cron: "47 2 * * *" # daily UTC 02:47, separate from GA4 collection
  workflow_dispatch:
    inputs:
      collection_mode:
        description: "Collection scope"
        required: true
        type: choice
        options: [page, camping-query, opportunity-query, sitewide-query]
        default: page
      jp_url_inspection_audit:
        description: "Run the fixed JP B25 URL Inspection audit on its dedicated branch"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site-measurement-collection
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    if: github.event_name != 'workflow_dispatch' || inputs.jp_url_inspection_audit != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Search Console API client
        run: python3 -m pip install google-api-python-client google-auth

      - name: Collect GSC page snapshot
        if: github.event_name != 'workflow_dispatch' || inputs.collection_mode == 'page'
        run: python3 scripts/collect_gsc_snapshot.py --output data/performance/gsc-latest.json --days 28

      - name: Collect camping query evidence snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.collection_mode == 'camping-query'
        run: python3 scripts/collect_gsc_camp_query_snapshot.py --output data/performance/gsc-camp-query-latest.json

      - name: Collect current revenue opportunity query evidence
        if: github.event_name == 'workflow_dispatch' && inputs.collection_mode == 'opportunity-query'
        run: python3 scripts/collect_gsc_opportunity_query_snapshot.py --output data/performance/gsc-opportunity-queries-latest.json

      - name: Collect site-wide page-query evidence snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.collection_mode == 'sitewide-query'
        run: |
          python3 scripts/collect_gsc_sitewide_query_snapshot.py \
            --gsc-snapshot data/performance/gsc-latest.json \
            --output "$RUNNER_TEMP/gsc-sitewide-query.json"

      - name: Validate GSC source snapshot
        if: github.event_name != 'workflow_dispatch' || inputs.collection_mode == 'page'
        run: |
          python3 - <<'PY'
          import json
          p = json.load(open('data/performance/gsc-latest.json'))
          assert p['status'] == 'VERIFIED'
          assert p['source'] == 'GOOGLE_SEARCH_CONSOLE_API'
          assert p['property'] == 'https://emfls.github.io/'
          assert p['pages']
          PY

      - name: Validate camping query evidence snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.collection_mode == 'camping-query'
        run: |
          python3 - <<'PY'
          import json
          from scripts.collect_gsc_camp_query_snapshot import validate_snapshot
          with open('data/performance/gsc-camp-query-latest.json', encoding='utf-8') as handle:
              snapshot = json.load(handle)
          print(json.dumps(validate_snapshot(snapshot), ensure_ascii=False))
          PY

      - name: Validate revenue opportunity query evidence snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.collection_mode == 'opportunity-query'
        run: |
          python3 - <<'PY'
          import json
          from scripts.collect_gsc_opportunity_query_snapshot import validate_snapshot
          with open('data/performance/gsc-opportunity-queries-latest.json', encoding='utf-8') as handle:
              snapshot = json.load(handle)
          print(json.dumps(validate_snapshot(snapshot), ensure_ascii=False))
          PY

      - name: Validate site-wide page-query evidence snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.collection_mode == 'sitewide-query'
        run: |
          python3 - "$RUNNER_TEMP/gsc-sitewide-query.json" <<'PY'
          import json
          import sys
          from scripts.collect_gsc_sitewide_query_snapshot import validate_snapshot
          with open(sys.argv[1], encoding='utf-8') as handle:
              snapshot = json.load(handle)
          print(json.dumps(validate_snapshot(snapshot), ensure_ascii=False))
          PY

      - name: Upload site-wide page-query evidence artifact
        if: github.event_name == 'workflow_dispatch' && inputs.collection_mode == 'sitewide-query'
        uses: actions/upload-artifact@v4
        with:
          name: gsc-sitewide-query-${{ github.run_id }}
          path: ${{ runner.temp }}/gsc-sitewide-query.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit refreshed GSC measurement artifacts
        if: github.event_name != 'workflow_dispatch' || inputs.collection_mode == 'page'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/performance/gsc-latest.json
          git diff --staged --quiet || git commit -m "chore: refresh GSC source snapshot"
          git push

      - name: Commit camping query evidence snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.collection_mode == 'camping-query'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/performance/gsc-camp-query-latest.json
          git diff --staged --quiet || git commit -m "chore: refresh GSC measurement snapshot"
          git push

      - name: Commit revenue opportunity query evidence snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.collection_mode == 'opportunity-query'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/performance/gsc-opportunity-queries-latest.json
          git diff --staged --quiet || git commit -m "chore: refresh GSC opportunity query evidence"
          git push


  inspect_jp_b25:
    if: github.event_name == 'workflow_dispatch' && inputs.jp_url_inspection_audit == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require the fixed JP audit branch
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/codex/jp-b25-url-inspection-audit-20261007" || {
            echo "JP B25 URL Inspection mode is restricted to its audit branch." >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Search Console API client
        run: python3 -m pip install google-api-python-client google-auth

      - name: Inspect the frozen B25 URL set
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON_B64 }}
        run: >-
          python3 scripts/inspect_gsc_urls.py
          --manifest data/jp-b25-url-inspection-input-20261007.csv
          --output-dir "$RUNNER_TEMP/jp-b25-url-inspection-${GITHUB_RUN_ID}"

      - name: Validate artifact-only output set
        run: |
          python3 - "$RUNNER_TEMP/jp-b25-url-inspection-${GITHUB_RUN_ID}" <<'PY'
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          expected = {
              "b25-input-manifest.csv",
              "b25-url-inspection.json",
              "b25-decision.csv",
              "b25-summary.json",
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          assert actual == expected, (actual, expected)
          assert all((root / name).stat().st_size > 0 for name in expected)
          PY

      - name: Upload seven-day URL Inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: jp-b25-url-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/jp-b25-url-inspection-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
