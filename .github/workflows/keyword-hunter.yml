name: Keyword Hunter

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Collection mode
        type: choice
        options: [broad, targeted]
        default: broad
        required: true
      keywords:
        description: 1-5 explicit queries (JSON array or one query per line; targeted mode only)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: keyword-hunter-production
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      NAVER_SEARCHAD_API_KEY: ${{ secrets.NAVER_SEARCHAD_API_KEY }}
      NAVER_SEARCHAD_SECRET_KEY: ${{ secrets.NAVER_SEARCHAD_SECRET_KEY }}
      NAVER_SEARCHAD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCHAD_CUSTOMER_ID }}
      NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
      NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
      NAVER_WEB_SEARCH_API_HUB_CLIENT_ID: ${{ secrets.NAVER_WEB_SEARCH_API_HUB_CLIENT_ID }}
      NAVER_WEB_SEARCH_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_WEB_SEARCH_API_HUB_CLIENT_SECRET }}
      KEYWORD_HUNTER_TARGETS_JSON: ${{ inputs.keywords }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate required credentials
        run: |
          if [ -z "$NAVER_SEARCHAD_API_KEY" ] || [ -z "$NAVER_SEARCHAD_SECRET_KEY" ] || [ -z "$NAVER_SEARCHAD_CUSTOMER_ID" ]; then
            echo "::error::Add the three NAVER_SEARCHAD repository secrets."
            exit 1
          fi
          if [ -z "$NAVER_API_HUB_CLIENT_ID" ] || [ -z "$NAVER_API_HUB_CLIENT_SECRET" ]; then
            echo "::error::Add the two NAVER_API_HUB repository secrets."
            exit 1
          fi

      - name: Install test runner
        run: python3 -m pip install pytest

      - name: Run Keyword Hunter
        if: github.event_name == 'schedule' || inputs.mode != 'targeted'
        run: python3 scripts/keyword_hunter.py

      - name: Verify Keyword Hunter
        run: python3 -m pytest tests/test_keyword_hunter*.py -q

      - name: Run targeted Keyword Hunter measurement
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'targeted'
        env:
          KEYWORD_HUNTER_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/keyword_hunter_targeted.py --root .

      - name: Prepare supervised review queue
        if: github.event_name == 'schedule' || inputs.mode != 'targeted'
        run: python3 scripts/prepare_keyword_launch.py --root .

      - name: Validate supervised review queue
        if: github.event_name == 'schedule' || inputs.mode != 'targeted'
        run: |
          python3 - <<'PY'
          import json
          from scripts.content_launch_policy import DAILY_PUBLICATION_LIMIT

          q=json.load(open('data/content-launch-queue.json', encoding='utf-8'))
          daily_limit=q.get('dailyLimit')
          assert type(daily_limit) is int and 0 <= daily_limit <= DAILY_PUBLICATION_LIMIT
          items=q.get('queue', [])
          assert isinstance(items, list) and len(items) <= daily_limit
          for item in items:
              assert item.get('status') == 'READY_TO_LAUNCH'
              assert item.get('review_status') == 'PAGE_REVIEW_READY'
              assert item.get('suggested_url','').startswith('/kor/')
          assert not any(k in q.get('excluded', {}) for k in [])
          PY

      - name: Protect publication state
        if: always()
        run: |
          for path in data/published_keywords.json data/content-launch-counter.json data/content-launch-manifest.json data/content-launch-decisions.json; do
            if ! git diff HEAD --quiet -- "$path" || [ -n "$(git ls-files --others --exclude-standard -- "$path")" ]; then
              echo "::error::Protected publication state changed: $path"
              exit 1
            fi
          done
          if git status --porcelain --untracked-files=all | grep -E '^.. kor/.*\.html$'; then
            echo "::error::HTML changed during measurement"
            exit 1
          fi

      - name: Persist measured state
        if: github.event_name == 'schedule' || inputs.mode != 'targeted'
        run: python3 scripts/keyword_hunter_persist.py --mode broad --base-sha "$GITHUB_SHA" --diagnostics-dir "$RUNNER_TEMP/keyword-hunter-persistence"

      - name: Persist targeted measurement
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'targeted'
        run: python3 scripts/keyword_hunter_persist.py --mode targeted --base-sha "$GITHUB_SHA" --diagnostics-dir "$RUNNER_TEMP/keyword-hunter-persistence"

      - name: Upload latest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyword-hunter-reports
          path: |
            reports/keyword-hunter/
            reports/keyword-targeted-validation/
            data/existing-page-improvement-candidates.json
            ${{ runner.temp }}/keyword-hunter-persistence/
          retention-days: 30
          if-no-files-found: warn
