name: Keyword Hunter targeted no-deploy canary

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the fixed one-query targeted measurement
        type: choice
        options: [targeted]
        default: targeted
        required: true
      keywords:
        description: Exact query; must match the authorized SC050 query
        type: string
        default: '윈도우 11 검색 창 새 UI 안 보임'
        required: true

permissions:
  contents: read

concurrency:
  group: keyword-hunter-production
  cancel-in-progress: false

jobs:
  validate-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out selected branch without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner without repository secrets
        run: python3 -m pip install pytest

      - name: Verify no-deploy canary contract and targeted collector
        run: python3 -m pytest tests/test_keyword_hunter_canary_workflow.py tests/test_keyword_hunter_targeted.py -q

  targeted-canary:
    needs: validate-canary
    if: inputs.mode == 'targeted' && inputs.keywords == '윈도우 11 검색 창 새 UI 안 보임'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      NAVER_SEARCHAD_API_KEY: ${{ secrets.NAVER_SEARCHAD_API_KEY }}
      NAVER_SEARCHAD_SECRET_KEY: ${{ secrets.NAVER_SEARCHAD_SECRET_KEY }}
      NAVER_SEARCHAD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCHAD_CUSTOMER_ID }}
      NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
      NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
      NAVER_WEB_SEARCH_API_HUB_CLIENT_ID: ${{ secrets.NAVER_WEB_SEARCH_API_HUB_CLIENT_ID }}
      NAVER_WEB_SEARCH_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_WEB_SEARCH_API_HUB_CLIENT_SECRET }}
      KEYWORD_HUNTER_TARGETS_JSON: '["윈도우 11 검색 창 새 UI 안 보임"]'
      KEYWORD_HUNTER_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out selected branch without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate required credentials without printing values
        run: |
          if [ -z "$NAVER_SEARCHAD_API_KEY" ] || [ -z "$NAVER_SEARCHAD_SECRET_KEY" ] || [ -z "$NAVER_SEARCHAD_CUSTOMER_ID" ]; then
            echo "::error::Required Search Ads credentials are unavailable."
            exit 1
          fi
          if [ -z "$NAVER_API_HUB_CLIENT_ID" ] || [ -z "$NAVER_API_HUB_CLIENT_SECRET" ]; then
            echo "::error::Required Naver API Hub credentials are unavailable."
            exit 1
          fi

      - name: Run the single authorized targeted measurement
        run: python3 scripts/keyword_hunter_targeted.py --root .

      - name: Upload the run-specific filtered measurement only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc050-keyword-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/keyword-targeted-validation/${{ github.run_id }}-${{ github.run_attempt }}.json
          retention-days: 7
          if-no-files-found: error
