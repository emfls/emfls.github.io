name: One-time Notion Publisher Merge Permission Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notion-merge-permission-smoke.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: notion-merge-permission-smoke
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'emfls/emfls.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Actions bot PR creation and merge without approval
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          first="notion/approval-probe-${GITHUB_RUN_ID}"
          git switch -c "$first"
          echo "Test GitHub Actions bot PR merge ability. One-time marker." > data/.notion-approval-merge-probe.txt
          git add -f data/.notion-approval-merge-probe.txt
          git commit -m "test: check Notion publisher bot merge permission"
          git push origin "HEAD:refs/heads/$first"
          gh pr create --head "$first" --base main --title "test: publisher auto-merge permission" --body "One-time permission smoke test after changing main branch approval policy. Contains only a disposable marker."
          gh pr merge "$first" --squash --delete-branch
          echo "AUTO_MERGE_PERMITTED"
          git fetch origin main
          git switch -C main origin/main
          second="notion/approval-probe-cleanup-${GITHUB_RUN_ID}"
          git switch -c "$second"
          git rm data/.notion-approval-merge-probe.txt
          git commit -m "test: clean up Notion publisher merge probe"
          git push origin "HEAD:refs/heads/$second"
          gh pr create --head "$second" --base main --title "test: remove publisher auto-merge probe" --body "Cleanup for the one-time automatic merge permission smoke test."
          gh pr merge "$second" --squash --delete-branch
          echo "AUTO_MERGE_PROBE_CLEANED"
