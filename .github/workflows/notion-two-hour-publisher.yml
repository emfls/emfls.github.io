name: Notion / Automatic Hourly Publishing

on:
  # The external HTTP scheduler uses GitHub's authenticated workflow_dispatch API.
  # No native GitHub cron or ChatGPT file-edit trigger: one scheduler, one writer.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  pull-requests: write

concurrency:
  group: scheduled-korean-article-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'emfls/emfls.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Honor strict one-hour publication spacing across scheduler jitter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import json
          import time
          ledger = Path("data/scheduled-publication-ledger.jsonl")
          entries = []
          if ledger.is_file():
              entries = [json.loads(s) for s in ledger.read_text(encoding="utf-8").splitlines() if s.strip()]
          previous = next((r for r in reversed(entries) if r.get("notionPageId") and r.get("slotKst")), None)
          if previous:
              last_time = datetime.fromisoformat(previous["slotKst"])
              if last_time.tzinfo is None:
                  raise SystemExit("Last publication timestamp has no timezone: cannot safely enforce cooldown")
              remaining = (last_time.astimezone(timezone.utc) + timedelta(hours=1) - datetime.now(timezone.utc)).total_seconds()
              if 0 < remaining <= 600:
                  seconds = remaining + 3
                  print(f"Waiting {seconds:.0f} seconds for one-hour publication cooldown", flush=True)
                  time.sleep(seconds)
              elif remaining > 600:
                  print(f"Cooldown has {remaining:.0f} seconds left; publisher will return COOLDOWN without publishing")
          PY

      - name: Load next ready Notion article and stage one page
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/notion_autopublish.py stage > notion-publish-result.json
          cat notion-publish-result.json
          python3 - <<'PY'
          import json,os
          row=json.load(open("notion-publish-result.json",encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              for field in ("status","destination","url","page_id"):
                  if field in row:
                      out.write(field+"="+row[field]+"\n")
          PY

      - name: Commit page, category sitemap and publication ledger
        if: steps.stage.outputs.status == 'SOURCE_STAGED'
        env:
          DESTINATION: ${{ steps.stage.outputs.destination }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DESTINATION" "$(dirname "$DESTINATION")/sitemap.xml"
          git add -f data/scheduled-publication-ledger.jsonl
          git diff --cached --check
          git commit -m "content: publish one original Notion guide"
          # Main has PR-only branch protection. Never push directly to main.
          branch="notion/auto-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$branch"
          export GH_TOKEN="$GITHUB_TOKEN"
          gh pr create --head "$branch" --base main \
            --title "content: publish one Notion guide" \
            --body "Automated publication of one validated Notion draft. Includes its category sitemap and deduplication ledger."
          if ! gh pr merge "$branch" --squash --delete-branch; then
            echo "::error::GitHub main branch requires at least one approving review by a user with write access. PR is created, but unattended merge is blocked. Configure an approved automation bypass/reviewer before relying on fully automatic publishing."
            exit 1
          fi

      - name: Rely on automatic Pages deployment after protected-main PR merge
        if: steps.stage.outputs.status == 'SOURCE_STAGED'
        shell: bash
        run: |
          echo "PR merged to main. GitHub Pages deploys automatically; verifying live page in the next step."

      - name: Verify published page content
        if: steps.stage.outputs.status == 'SOURCE_STAGED'
        env:
          DESTINATION: ${{ steps.stage.outputs.destination }}
          PUBLIC_URL: ${{ steps.stage.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,time
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          url=os.environ["PUBLIC_URL"]
          path=os.environ["DESTINATION"]
          title=open(path,encoding="utf-8").read().split("<title>",1)[1].split("</title>",1)[0]
          for retry in range(24):
              try:
                  request=Request(url+"?notion-verify="+str(retry),headers={"Cache-Control":"no-cache"})
                  with urlopen(request,timeout=15) as response:
                      if response.status==200 and title in response.read().decode("utf-8",errors="replace"):
                          print("LIVE VERIFIED:",url)
                          raise SystemExit(0)
              except (HTTPError,URLError,TimeoutError):
                  pass
              time.sleep(15)
          raise SystemExit("NOT_LIVE: public page could not be verified")
          PY

      - name: Mark Notion item published after live verification
        if: steps.stage.outputs.status == 'SOURCE_STAGED'
        env:
          NOTION_PAGE_ID: ${{ steps.stage.outputs.page_id }}
          PUBLIC_URL: ${{ steps.stage.outputs.url }}
        run: |
          python3 scripts/notion_autopublish.py finalize --page-id "$NOTION_PAGE_ID" --url "$PUBLIC_URL"

      - name: Optional IndexNow submission
        if: steps.stage.outputs.status == 'SOURCE_STAGED'
        env:
          PUBLIC_URL: ${{ steps.stage.outputs.url }}
        shell: bash
        run: |
          if [ -n "$INDEXNOW_KEY" ]; then
            mkdir -p artifacts
            python3 scripts/indexnow_submit.py --root . --before HEAD^ --sha HEAD --backfill-urls "$PUBLIC_URL" --report artifacts/notion-indexnow.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notion-publication-${{ github.run_id }}
          path: |
            notion-publish-result.json
            artifacts/notion-indexnow.json
          if-no-files-found: warn
