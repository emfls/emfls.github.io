name: Notion / Automatic Hourly Publishing

on:
  # The external HTTP scheduler uses GitHub's authenticated workflow_dispatch API.
  # No native GitHub cron or ChatGPT file-edit trigger: one scheduler, one writer.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  pull-requests: write
  actions: write # Rerun a failed GitHub Pages deployment job, never a publisher job.

concurrency:
  group: scheduled-korean-article-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'emfls/emfls.github.io'
    runs-on: ubuntu-latest
    # Covers previous deploy recovery (11m), cooldown (10m), verification (10m),
    # current deploy recovery (15m), QA, network overhead and setup.
    # The hourly schedule and single-writer concurrency are unchanged.
    timeout-minutes: 55
    env:
      TZ: Asia/Seoul
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # workflow_dispatch may be queued while another writer commits a new
      # article. Fetch latest main after the concurrency lock is acquired so
      # cooldown and duplicate detection use the up-to-date ledger.
      - name: Refresh current main before choosing a Notion draft
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git reset --hard origin/main
          echo "Publication starting at main $(git rev-parse --short HEAD)"

      # If the previous merged page is not live, inspect only the Pages deployment
      # for current main. Retry its failed deploy job at most twice and wait for
      # verified public content. A failed/unknown recovery blocks the next draft.
      - name: Recover failed Pages deploy and verify previous article
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/recover_pages_deployment.py

      - name: Load next ready Notion article and stage one page
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/notion_autopublish.py stage --wait-for-slot > notion-publish-result.json
          cat notion-publish-result.json
          python3 - <<'PY'
          import json,os
          row=json.load(open("notion-publish-result.json",encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              for field in ("status","destination","url","page_id","failed_count"):
                  if field in row:
                      out.write(field+"="+str(row[field])+"\n")
          if row.get("failed_count", 0):
              print("::warning::Marked " + str(row["failed_count"]) +
                    " invalid Notion drafts 발행실패; attempted the next ready draft.")
          PY

      - name: Connect new article to static site discovery and RSS
        if: steps.stage.outputs.status == 'SOURCE_STAGED'
        env:
          DESTINATION: ${{ steps.stage.outputs.destination }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/refresh_notion_discovery.py "$DESTINATION"
          python3 scripts/build_content_index.py
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ["DESTINATION"])
          article = path.read_text(encoding="utf-8")
          home = Path("index.html").read_text(encoding="utf-8")
          category = (path.parent / "index.html").read_text(encoding="utf-8")
          rss = Path("feed.xml").read_text(encoding="utf-8")
          assert 'notion-discovery:start' in home, "Homepage static links missing"
          assert 'notion-discovery:start' in category, "Category static links missing"
          assert '/kor/report/recent/' in home, "Archive link missing"
          assert 'notion-discovery:start' in article, "New article related links missing"
          assert str(path) in rss, "Latest article absent from RSS"
          print("DISCOVERY_LINKS_VALIDATED")
          PY

      # Bot PR runs need human approval. Run the same fail-closed QA here,
      # before any PR is created or merged, without expanding permissions.
      - name: Validate staged article with shared discovery QA
        if: steps.stage.outputs.status == 'SOURCE_STAGED'
        env:
          DESTINATION: ${{ steps.stage.outputs.destination }}
        shell: bash
        run: python3 scripts/run_notion_discovery_qa.py --destination "$DESTINATION"

      - name: Commit page and discovery links through protected-main PR
        if: steps.stage.outputs.status == 'SOURCE_STAGED'
        env:
          DESTINATION: ${{ steps.stage.outputs.destination }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DESTINATION" "$(dirname "$DESTINATION")/sitemap.xml" \
            "$(dirname "$DESTINATION")/index.html" index.html \
            kor/report/recent/index.html feed.xml \
            data/content-index-ko.json data/home-feed-ko.json
          git add -f data/scheduled-publication-ledger.jsonl
          git diff --cached --check
          git commit -m "content: publish one original Notion guide"
          # Main has PR-only branch protection. Never push directly to main.
          branch="notion/auto-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$branch"
          export GH_TOKEN="$GITHUB_TOKEN"
          gh pr create --head "$branch" --base main \
            --title "content: publish one Notion guide" \
            --body "Automated publication of one validated Notion draft. Includes category sitemap, static homepage/category/related links, RSS, indexes and deduplication ledger."
          if ! gh pr merge "$branch" --squash --delete-branch; then
            echo "::error::GitHub main branch requires at least one approving review by a user with write access. PR is created, but unattended merge is blocked. Configure an approved automation bypass/reviewer before relying on fully automatic publishing."
            exit 1
          fi

      - name: Rely on automatic Pages deployment after protected-main PR merge
        if: steps.stage.outputs.status == 'SOURCE_STAGED'
        shell: bash
        run: |
          echo "PR merged to main. GitHub Pages deploys automatically; verifying live page in the next step."

      - name: Verify published page content
        id: verify
        continue-on-error: true
        if: steps.stage.outputs.status == 'SOURCE_STAGED'
        env:
          DESTINATION: ${{ steps.stage.outputs.destination }}
          PUBLIC_URL: ${{ steps.stage.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,time
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          url=os.environ["PUBLIC_URL"]
          path=os.environ["DESTINATION"]
          title=open(path,encoding="utf-8").read().split("<title>",1)[1].split("</title>",1)[0]
          deadline=time.monotonic()+600
          for retry in range(40):
              remaining=deadline-time.monotonic()
              if remaining<=0:
                  break
              try:
                  request=Request(url+"?notion-verify="+str(retry),headers={"Cache-Control":"no-cache"})
                  with urlopen(request,timeout=min(15,remaining)) as response:
                      if response.status==200 and title in response.read().decode("utf-8",errors="replace"):
                          print("LIVE VERIFIED:",url)
                          raise SystemExit(0)
              except (HTTPError,URLError,TimeoutError):
                  pass
              time.sleep(min(15,max(0,deadline-time.monotonic())))
          raise SystemExit("NOT_LIVE: public page could not be verified")
          PY

      # The original verifier can expire just before Pages reports its timeout.
      # Wait for that result and retry only the failed deploy, not the publisher.
      - name: Recover current Pages deployment after live verification timeout
        if: steps.stage.outputs.status == 'SOURCE_STAGED' && steps.verify.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          # Includes the tail of the original deploy plus one full 10-minute
          # deploy retry and queue/propagation margin. Does NOT extend Pages' cap.
          python3 scripts/recover_pages_deployment.py --sha "$(git rev-parse origin/main)" --wait-seconds 900

      - name: Mark Notion item published after live verification
        if: steps.stage.outputs.status == 'SOURCE_STAGED'
        env:
          NOTION_PAGE_ID: ${{ steps.stage.outputs.page_id }}
          PUBLIC_URL: ${{ steps.stage.outputs.url }}
        run: |
          python3 scripts/notion_autopublish.py finalize --page-id "$NOTION_PAGE_ID" --url "$PUBLIC_URL"

      - name: Optional IndexNow submission
        if: steps.stage.outputs.status == 'SOURCE_STAGED'
        env:
          PUBLIC_URL: ${{ steps.stage.outputs.url }}
        shell: bash
        run: |
          if [ -n "$INDEXNOW_KEY" ]; then
            mkdir -p artifacts
            python3 scripts/indexnow_submit.py --root . --before HEAD^ --sha HEAD --backfill-urls "$PUBLIC_URL" --report artifacts/notion-indexnow.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notion-publication-${{ github.run_id }}
          path: |
            notion-publish-result.json
            artifacts/notion-indexnow.json
          if-no-files-found: warn
