name: Notion Static Discovery QA

on:
  push:
    branches: [main]
    paths:
      - scripts/refresh_notion_discovery.py
      - scripts/build_content_index.py
      - scripts/run_notion_discovery_qa.py
      - scripts/recover_pages_deployment.py
      - tests/test_notion_discovery*.py
      - tests/test_homepage_seo.py
      - tests/test_pages_deployment_recovery.py
      - index.html
      - .github/workflows/notion-two-hour-publisher.yml
      - .github/workflows/notion-discovery-qa.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/refresh_notion_discovery.py
      - scripts/build_content_index.py
      - scripts/run_notion_discovery_qa.py
      - tests/test_notion_discovery*.py
      - tests/test_homepage_seo.py
      - index.html
      - tests/test_pages_deployment_recovery.py
      - scripts/recover_pages_deployment.py
      - .github/workflows/notion-two-hour-publisher.yml
      - .github/workflows/notion-discovery-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Bot PRs can require human workflow approval. The trusted publisher also
      # runs this same fail-closed gate before committing; PR checks stay enabled.
      - name: Shared regression and isolated integration QA
        run: python3 scripts/run_notion_discovery_qa.py
