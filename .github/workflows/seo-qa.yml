name: SEO QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python3 -m pip install pytest requests

      - name: Regenerate deterministic site audit
        run: python3 scripts/seo_audit.py . --json data/site-audit.json --markdown reports/seo-audit.md

      - name: Calculate page and site quality scores
        run: python3 scripts/quality_audit.py --as-of "$(date +%F)" --dashboard /tmp/site-quality-dashboard.html

      - name: Validate Naver URL performance snapshot
        run: python3 scripts/naver_performance.py --snapshot data/naver/search-advisor-2026-08-30.json --page-scores data/page-scores.json --report reports/naver-data-quality.md

      - name: Calculate revenue opportunities from available performance data
        run: python3 scripts/revenue_growth.py --as-of "$(date +%F)" --naver-snapshot data/naver/search-advisor-2026-08-30.json

      - name: Validate deterministic growth-run artifacts
        run: python3 scripts/daily_revenue_growth.py --run-at "$(date -Iseconds)" --research data/new-content-research.json

      - name: Guard automated content launch changes
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --depth=1
            COMPARE_REF="origin/$BASE_REF"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            COMPARE_REF="$EVENT_BEFORE"
          else
            COMPARE_REF="HEAD^"
          fi
          python3 scripts/content_launch_guard.py --root . --manifest data/content-launch-manifest.json --base-ref "$COMPARE_REF"

      - name: Render revenue growth control center
        run: python3 scripts/quality_audit.py --as-of "$(date +%F)" --revenue data/revenue-opportunities.json --dashboard reports/site-quality-dashboard.html

      - name: Reject new SEO regressions
        run: python3 scripts/seo_qa.py . --audit data/site-audit.json --baseline data/seo-qa-baseline.json --report reports/seo-qa.md

      - name: Run unittest regression suite
        run: python3 -m unittest discover -s tests -q

      - name: Run complete pytest suite
        run: python3 -m pytest -q

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-qa-reports
          path: |
            reports/seo-audit.md
            reports/seo-qa.md
            SITE_SCORE.md
            data/site-score.json
            data/revenue-opportunities.json
            data/new-content-opportunities.json
            data/content-launch-manifest.json
            reports/naver-data-quality.md
            reports/revenue-growth-report.md
            reports/daily-revenue-growth.md
            reports/site-quality-dashboard.html
          if-no-files-found: warn
