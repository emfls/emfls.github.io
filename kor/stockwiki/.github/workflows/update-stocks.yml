name: Update Stock Data

on:
  schedule:
    - cron: "0 1 * * 1-5"  # 평일 UTC 01:00 = KST 10:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kor/stockwiki

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install yfinance pykrx pandas requests lxml html5lib

      - name: Backup existing data
        run: |
          DATE=$(date +'%Y-%m-%d')
          mkdir -p data/stocks/_backup
          for f in data/stocks/*.json; do
            [ -f "$f" ] && cp "$f" "data/stocks/_backup/$(basename $f .json)_${DATE}.json" || true
          done
          echo "Backup complete: $DATE"

      - name: Run stock updater
        run: python scripts/update_stocks.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node deps
        run: npm ci

      - name: Build Astro + Pagefind
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: kor/stockwiki/dist
          destination_dir: kor/stockwiki
          keep_files: false

      - name: Commit data update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update stock data $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
