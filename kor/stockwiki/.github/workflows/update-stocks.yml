name: Update Stock Data

on:
  schedule:
    - cron: "0 1 * * 1-5"  # 평일 UTC 01:00 = KST 10:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install yfinance pykrx pandas requests lxml html5lib

      - name: Backup existing data
        run: |
          DATE=$(date +'%Y-%m-%d')
          mkdir -p kor/stockwiki/data/stocks/_backup
          for f in kor/stockwiki/data/stocks/*.json; do
            [ -f "$f" ] && cp "$f" "kor/stockwiki/data/stocks/_backup/$(basename $f .json)_${DATE}.json" || true
          done
          echo "Backup complete: $DATE"

      - name: Run stock updater
        run: python kor/stockwiki/scripts/update_stocks.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node deps
        working-directory: kor/stockwiki
        run: npm ci

      - name: Build Astro + Sitemap + Pagefind
        working-directory: kor/stockwiki
        run: npm run build

      - name: Copy built files to serve directory
        working-directory: kor/stockwiki
        run: |
          cp -r dist/index.html dist/_assets dist/pagefind dist/robots.txt dist/sitemap.xml dist/stocks .
          echo "Built files copied to kor/stockwiki/"

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kor/stockwiki/data/ kor/stockwiki/index.html kor/stockwiki/_assets kor/stockwiki/pagefind kor/stockwiki/stocks kor/stockwiki/sitemap.xml kor/stockwiki/robots.txt
          git diff --staged --quiet || git commit -m "chore: update stock data $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
