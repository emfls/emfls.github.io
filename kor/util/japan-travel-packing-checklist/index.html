<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일본 여행 준비물 체크리스트 2026 | 출발 전 일정별 점검</title><meta name="description" content="계절, 여행일수, 수하물과 어린이 동반 여부에 맞춘 일본 여행 준비물 체크리스트를 저장하고 인쇄하세요."><meta name="robots" content="index,follow"><link rel="canonical" href="https://emfls.github.io/kor/util/japan-travel-packing-checklist/"><meta property="og:title" content="일본 여행 준비물 체크리스트 2026"><meta property="og:url" content="https://emfls.github.io/kor/util/japan-travel-packing-checklist/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"일본 여행 준비물 체크리스트","url":"https://emfls.github.io/kor/util/japan-travel-packing-checklist/","applicationCategory":"TravelApplication","operatingSystem":"Any","inLanguage":"ko-KR","dateModified":"2026-08-12"}</script><script async src="https://www.googletagmanager.com/gtag/js?id=G-QP5Q67GE5B"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-QP5Q67GE5B')</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8830524482034754" crossorigin="anonymous"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#fff8f6;color:#382523;font:16px/1.65 system-ui,sans-serif}header{background:#9c2e34;color:#fff;padding:32px 20px}header div,main,footer{max-width:850px;margin:auto}.panel{background:#fff;border:1px solid #ead3cf;border-radius:16px;padding:20px;margin:20px 0;box-shadow:0 6px 22px #6b232312}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{font-weight:700}select,input{width:100%;padding:11px;border:1px solid #cba6a2;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 16px;background:#a63139;color:#fff;font-weight:800}.secondary{background:#6d5b59}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.item{display:flex;gap:9px;padding:9px;border-bottom:1px solid #f0dfdc}.item input{width:auto}.phase{font-size:.78rem;color:#9c2e34;font-weight:900;min-width:40px}.category{font-size:.78rem;color:#745653;min-width:50px}a{color:#075fa5}@media(max-width:600px){.form{grid-template-columns:1fr}}@media print{header,.form,.actions,.links{display:none}.panel{box-shadow:none;border:0}}</style></head><body><header><div><p>2026년 8월 12일 검토</p><h1>일본 여행 준비물 체크리스트</h1><p>출발 D-30부터 D-1까지 내 조건에 맞춰 점검하세요.</p></div></header><main><section class="panel"><h2>여행 조건</h2><div class="form"><label>계절<select id="season"><option value="spring">봄</option><option value="summer">여름</option><option value="autumn">가을</option><option value="winter">겨울</option></select></label><label>여행일수<input id="days" type="number" min="1" max="60" value="4"></label><label><input id="checkedBag" type="checkbox" style="width:auto"> 위탁수하물 이용</label><label><input id="children" type="checkbox" style="width:auto"> 어린이 동반</label></div><div class="actions"><button id="make">목록 만들기</button><button id="reset" class="secondary">체크 초기화</button><button class="secondary" onclick="print()">인쇄</button></div></section><section class="panel"><h2>내 체크리스트</h2><div id="list"><noscript>기본 준비물: 여권, 항공권, 숙소 확인서, 결제수단, 통신수단, 충전기, 상비약. 맞춤 기능은 JavaScript를 켜면 사용할 수 있습니다.</noscript></div></section><section class="panel"><h2>공식 정보 확인</h2><p>입국·세관·수하물 조건은 바뀔 수 있습니다. 출발 전에 일본 정부와 이용 항공사의 최신 안내를 확인하세요.</p><p class="links"><a href="https://www.vjw.digital.go.jp/" rel="noopener">Visit Japan Web</a> · <a href="https://www.customs.go.jp/english/summary/passenger.htm" rel="noopener">일본 세관</a> · <a href="/kor/util/japan-esim-data-calculator/">일본 eSIM 데이터 계산기</a> · <a href="/kor/report/travel/japan-tokyo.html">도쿄 여행 가이드</a></p></section></main><footer><p>본 목록은 여행 준비를 돕는 참고 자료이며 입국을 보장하지 않습니다.</p></footer><script src="app.js"></script><script>const key='japan-pack-v1';function draw(){const rows=buildJapanPackingList({season:season.value,days:days.value,checkedBag:checkedBag.checked,children:children.checked});let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}list.innerHTML=rows.map(r=>`<label class="item"><input type="checkbox" data-k="${r.item}" ${saved[r.item]?'checked':''}><span class="phase">${r.phase}</span><span class="category">${r.category}</span><span>${r.item}</span></label>`).join('');list.querySelectorAll('input').forEach(x=>x.onchange=()=>{let s={};list.querySelectorAll('input').forEach(c=>s[c.dataset.k]=c.checked);try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}})}make.onclick=draw;reset.onclick=()=>{try{localStorage.removeItem(key)}catch(e){}draw()};draw()</script></body></html>
