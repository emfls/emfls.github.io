<style>*{box-sizing:border-box}body{margin:0;background:#f3f7f2;color:#183126;font:16px/1.65 system-ui,sans-serif}header{background:#174d36;color:#fff;padding:32px 20px}header div,main,footer{max-width:850px;margin:auto}h1{margin:.2rem 0}.panel{background:#fff;border:1px solid #cfe0d5;border-radius:16px;padding:20px;margin:20px 0;box-shadow:0 6px 22px #163b2412}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{font-weight:700}select,input{width:100%;padding:11px;border:1px solid #9fb9aa;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 16px;background:#176b45;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#52675d}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.item{display:flex;gap:10px;padding:9px;border-bottom:1px solid #e4ece7}.item input{width:auto}.tag{font-size:.78rem;color:#176b45;font-weight:800;min-width:46px}a{color:#075fa5}@media(max-width:600px){.form{grid-template-columns:1fr}}@media print{header,.form,.actions,.links,.ad-note{display:none}.panel{box-shadow:none;border:0}}</style></head><body>
<header><div><p>무료 맞춤 도구</p><h1>캠핑 준비물 체크리스트</h1><p>인원·계절·캠핑 방식에 맞춰 필요한 짐만 빠르게 확인하세요.</p></div></header><main>
<section class="panel"><h2>조건 선택</h2><div class="form"><label>인원<input id="people" type="number" min="1" max="12" value="2"></label><label>숙박일<input id="nights" type="number" min="1" max="14" value="1"></label><label>계절<select id="season"><option value="spring">봄</option><option value="summer">여름</option><option value="autumn">가을</option><option value="winter">겨울</option></select></label><label>유형<select id="type"><option value="auto">오토캠핑</option><option value="backpacking">백패킹</option><option value="glamping">글램핑</option></select></label></div><div class="actions"><button id="make">목록 만들기</button><button class="secondary" id="reset">체크 초기화</button><button class="secondary" onclick="print()">인쇄</button></div></section>
<section class="panel"><h2>내 준비물</h2><div id="list"><noscript>기본 준비물: 텐트, 침낭, 매트, 식수, 식기, 랜턴, 구급함, 쓰레기봉투. 맞춤 목록은 JavaScript를 켜면 사용할 수 있습니다.</noscript></div></section>
<section class="panel"><h2>출발 전 확인</h2><p>관광지나 주차장은 자동으로 야영·취사가 허용되는 장소가 아닙니다. 운영 주체의 예약 화면, 현장 표지와 금지 공지를 출발 직전에 확인하세요.</p><p class="links"><a href="/kor/report/camp/">국내 캠핑 가이드</a> · <a href="https://www.gocamping.or.kr/" rel="noopener">한국관광공사 고캠핑</a></p></section><p class="ad-note">광고는 도구의 버튼이나 체크 항목과 구분되어 표시됩니다.</p></main><footer><p>결과는 참고용입니다. 현장 규정과 날씨를 다시 확인하세요.</p></footer>
<script src="app.js"></script><script>const key='camping-check-v1';function draw(){const rows=buildCampingList({people:people.value,nights:nights.value,season:season.value,type:type.value});let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};list.innerHTML=rows.map((r,i)=>`<label class="item"><input type="checkbox" data-k="${r.item}" ${saved[r.item]?'checked':''}><span class="tag">${r.category}</span><span>${r.item}</span></label>`).join('');list.querySelectorAll('input').forEach(x=>x.onchange=()=>{let s={};list.querySelectorAll('input').forEach(c=>s[c.dataset.k]=c.checked);try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}})}make.onclick=draw;reset.onclick=()=>{try{localStorage.removeItem(key)}catch(e){}draw()};draw()</script></body></html>
