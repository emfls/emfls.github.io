<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>emfls 칼럼 — AI·경제·건강·라이프 인사이트</title>
<meta name="description" content="AI·경제·테크·건강·투자 분야의 깊이 있는 칼럼. 최신 인사이트 리포트를 제공합니다.">
<link rel="canonical" href="https://emfls.com/kor/column/">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QP5Q67GE5B"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-QP5Q67GE5B');</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#0d1117;color:#e6edf3;line-height:1.75}
.site-header{background:linear-gradient(90deg,#4e54c8,#8f94fb);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.site-header .logo{color:#fff;font-weight:800;font-size:1.1rem;text-decoration:none}
.site-header nav{display:flex;gap:12px}
.site-header nav a{color:rgba(255,255,255,.85);text-decoration:none;font-size:.85rem;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.3)}
.site-header nav a.active{background:#fff;color:#4e54c8;font-weight:700}
.hero{background:linear-gradient(135deg,#0d1117,#161b22,#1a1f2e);border-bottom:1px solid #21262d;padding:56px 24px 48px;text-align:center}
.hero .badge{display:inline-block;background:#388bfd22;color:#58a6ff;border:1px solid #388bfd55;padding:4px 16px;border-radius:20px;font-size:.78rem;font-weight:700;letter-spacing:.5px;margin-bottom:16px}
.hero h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;margin-bottom:12px;background:linear-gradient(90deg,#e6edf3 30%,#58a6ff 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:#8b949e;font-size:1rem;max-width:500px;margin:0 auto}
.hero-count{margin-top:16px;font-size:.85rem;color:#58a6ff;font-weight:600}
.container{max-width:960px;margin:0 auto;padding:36px 20px}
.section-title{font-size:1rem;font-weight:700;color:#8b949e;letter-spacing:.5px;margin-bottom:20px;padding-left:10px;border-left:3px solid #388bfd;display:flex;align-items:center;justify-content:space-between}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-bottom:40px}
.col-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:22px;text-decoration:none;color:inherit;display:block;transition:.2s;position:relative;overflow:hidden;opacity:0;transform:translateY(16px);animation:fadeUp .35s ease forwards}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
.col-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#388bfd,#58a6ff)}
.col-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.4);border-color:#388bfd55}
.col-card h2{font-size:1rem;font-weight:700;line-height:1.4;margin-bottom:8px;color:#e6edf3}
.col-card h2 .col-sub{font-size:.82rem;font-weight:400;color:#8b949e;display:block;margin-top:3px;line-height:1.4}
.col-card .desc{font-size:.83rem;color:#8b949e;line-height:1.6;margin-bottom:12px}
.col-card .meta{font-size:.75rem;color:#6e7681;display:flex;align-items:center;gap:10px}
.col-card .read-more{margin-left:auto;color:#388bfd;font-weight:600}
.cat-badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:10px;margin-bottom:12px}
.cat-ai{background:#388bfd22;color:#58a6ff;border:1px solid #388bfd44}
.cat-economy{background:#23863622;color:#56d364;border:1px solid #23863644}
.cat-tech{background:#6e401522;color:#ffa657;border:1px solid #6e401544}
.cat-game{background:#a371f722;color:#a371f7;border:1px solid #a371f744}

/* 로딩 스피너 */
#loader{display:flex;justify-content:center;align-items:center;gap:8px;padding:32px;display:none}
#loader span{width:8px;height:8px;border-radius:50%;background:#388bfd;animation:bounce .6s infinite alternate}
#loader span:nth-child(2){animation-delay:.2s}
#loader span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{transform:translateY(-10px);opacity:.4}}

/* 끝 메시지 */
#end-msg{text-align:center;padding:32px;color:#6e7681;font-size:.85rem;display:none}
#end-msg span{display:inline-block;background:#161b22;border:1px solid #30363d;padding:8px 20px;border-radius:20px}

footer{text-align:center;padding:28px;color:#6e7681;font-size:.78rem;border-top:1px solid #21262d;margin-top:20px}
footer a{color:#58a6ff;text-decoration:none}
@media(max-width:600px){.site-header nav{display:none}}
</style>
</head>
<body>
<header class="site-header">
  <a class="logo" href="https://emfls.com">emfls</a>
  <nav>
    <a href="https://emfls.com">홈</a>
    <a href="https://emfls.com/kor/column/" class="active">칼럼</a>
    <a href="https://emfls.com/kor/report/stock/">주식</a>
    <a href="https://emfls.com/kor/report/coin/">코인</a>
    <a href="https://emfls.com/kor/report/camp/">캠핑</a>
  </nav>
</header>

<div class="hero">
  <div class="badge">📰 COLUMN</div>
  <h1>emfls 인사이트 칼럼</h1>
  <p>AI·경제·투자·건강·라이프 분야의 깊이 있는 분석 칼럼</p>
  <div class="hero-count" id="total-count"></div>
</div>

<div class="container">
  <div class="section-title">
    <span>최신 칼럼</span>
    <span id="shown-count" style="font-weight:400;font-size:.8rem;color:#6e7681"></span>
  </div>
  <div class="card-grid" id="card-grid"></div>
  <div id="loader"><span></span><span></span><span></span></div>
  <div id="end-msg"><span>✅ 모든 칼럼을 불러왔습니다</span></div>
</div>

<footer>
  <p>© 2026 <a href="https://emfls.com">emfls</a> | AI·경제·테크 인사이트 칼럼</p>
</footer>

<script>
const PAGE_SIZE = 12;
let allColumns = [];
let currentIndex = 0;
let isLoading = false;

function createCard(col, delay) {
  return `<a class="col-card" href="${col.file}" style="animation-delay:${delay}ms">
    <span class="cat-badge ${col.catClass}">${col.cat}</span>
    <h2>${col.title}</h2>
    <p class="desc">${col.desc}</p>
    <div class="meta">
      <span>${col.date}</span><span>·</span>
      <span class="read-more">읽기 →</span>
    </div>
  </a>`;
}

function renderCards() {
  if (isLoading || currentIndex >= allColumns.length) return;
  isLoading = true;

  const loader = document.getElementById('loader');
  loader.style.display = 'flex';

  setTimeout(() => {
    const grid = document.getElementById('card-grid');
    const batch = allColumns.slice(currentIndex, currentIndex + PAGE_SIZE);

    batch.forEach((col, i) => {
      grid.insertAdjacentHTML('beforeend', createCard(col, i * 40));
    });

    currentIndex += batch.length;

    // 카운터 업데이트
    document.getElementById('shown-count').textContent =
      `${currentIndex} / ${allColumns.length}편 표시 중`;

    loader.style.display = 'none';
    isLoading = false;

    if (currentIndex >= allColumns.length) {
      observer.disconnect();
      document.getElementById('end-msg').style.display = 'block';
    }
  }, 300); // 로딩 체감을 위한 미세 딜레이
}

// Intersection Observer — 페이지 하단 감지
const sentinel = document.createElement('div');
sentinel.id = 'sentinel';
sentinel.style.height = '1px';
document.querySelector('.container').appendChild(sentinel);

const observer = new IntersectionObserver((entries) => {
  if (entries[0].isIntersecting) renderCards();
}, { rootMargin: '200px' }); // 하단 200px 전에 미리 로드

// columns.json 불러오기
fetch('columns.json')
  .then(r => r.json())
  .then(data => {
    allColumns = data;
    document.getElementById('total-count').textContent =
      `총 ${allColumns.length}편의 칼럼`;
    observer.observe(sentinel);
  })
  .catch(() => {
    // JSON 로드 실패 시 폴백 메시지
    document.getElementById('card-grid').innerHTML =
      '<p style="color:#8b949e;padding:40px 0">칼럼을 불러오는 중 오류가 발생했습니다.</p>';
  });
</script>
</body>
</html>
