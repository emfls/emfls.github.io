(function() {
  const containers = document.querySelectorAll('[data-cp-category]');
  if (containers.length === 0) return;

  containers.forEach(container => {
    const products = JSON.parse(container.getAttribute('data-cp-products') || '[]');
    if (products.length === 0) return;

    const cards = container.querySelectorAll('.cp-card');
    const itemsPerPage = 3;

    if (products.length <= itemsPerPage) return; // 3개 이하면 로테이션 불필요

      cards.forEach((card) => {
        const randomProduct = products[Math.floor(Math.random() * products.length)];

        card.style.opacity = '0';
        setTimeout(() => {
          const img = card.querySelector('img');
          const name = card.querySelector('.cp-card-name');
          const price = card.querySelector('.cp-card-price');

          if (img) { img.src = randomProduct.image; img.alt = randomProduct.name; }
          if (name) {
            let txt = randomProduct.name.substring(0, 30);
            if (randomProduct.name.length > 30) txt += '…';
            name.textContent = txt;
            if (randomProduct.is_rocket) name.innerHTML += '<span class="cp-rocket">로켓</span>';
          }
          if (price) price.textContent = randomProduct.price ? randomProduct.price.toLocaleString('ko-KR') + '원' : '';
          card.href = randomProduct.url;
          card.style.opacity = '1';
        }, 200);
      });
    }, 3000);
  });
})();
